services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-knowflow}
      MYSQL_USER: ${MYSQL_USER:-knowflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root-local}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - knowflow_mysql_data:/var/lib/mysql
      - ./apps/api/src/knowflow/app/schema.sql:/docker-entrypoint-initdb.d/01-knowflow.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  knowflow_mysql_data:
